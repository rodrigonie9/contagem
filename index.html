<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contagem">
<meta name="theme-color" content="#ffffff">
<title>Contagem</title>
<style>
/* Padrão visual: fundo branco, azul do app da loja, cartões com borda azul-clara arredondada */
:root{
  --bg:#FFFFFF; --soft:#F3F9FD; --ink:#2B2F33; --muted:#6B7378; --line:#E3E8EC;
  --blue:#0A78D2; --blue-press:#0864B0; --sky:#41C1EE; --sky-soft:#E8F6FD;
  --ok:#1E9E55; --ok-soft:#E3F5EA; --warn:#D9822B; --warn-soft:#FDF1E4; --err:#D63B3B; --err-soft:#FCE6E6;
  --cam:#000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
input{user-select:text;-webkit-user-select:text}
.num{font-variant-numeric:tabular-nums}

.scr{display:none;flex:1;flex-direction:column;min-height:0}
.scr.on{display:flex}

/* cabeçalho */
.head{display:flex;align-items:center;gap:10px;padding:8px 16px}
.head .t{flex:1;min-width:0}
.head h1{margin:0;font-size:20px;font-weight:700;color:#555;line-height:1.1}
.head small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.err{background:var(--err-soft);color:var(--err)}

/* câmera */
.cam{position:relative;flex:0 0 38%;background:var(--cam);overflow:hidden;transition:flex-basis .2s ease}
.cam.small{flex-basis:20%}
video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;left:8%;right:8%;top:20%;bottom:20%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.4);transition:border-color .12s,background .12s}
.guide::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff4b4b;box-shadow:0 0 8px #ff4b4b}
.guide.hit{border-color:#3CC274;background:rgba(60,194,116,.25)}
.cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 3px #000;pointer-events:none;padding:0 50px}
.cbtn{position:absolute;right:10px;display:none;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:700;align-items:center;justify-content:center}
#bTorch{top:10px} #bZoom{top:60px}
.cbtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.cam.small .cap,.cam.small .cbtn{visibility:hidden}
.start{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:#000;color:#fff;font-size:15px}
.start button{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:700}

/* sessão */
.sess{flex:1;min-height:0;display:flex;flex-direction:column}
.sess-h{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 4px}
.sess-h b{font-size:16px;font-weight:700;color:#555}
.sess-h span{font-size:13px;color:var(--muted)}
.list{flex:1;overflow:auto;padding:0 16px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it .d{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .q{font-size:20px;font-weight:700;color:var(--blue);text-align:right;grid-row:span 2;align-self:center;white-space:nowrap}
.it .q small{font-size:13px}
.it .s{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.it.nc .d{color:var(--warn)}
.it.exc .d{text-decoration:line-through;color:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pill.fila{background:var(--warn-soft);color:var(--warn)}
.pill.env{background:var(--ok-soft);color:var(--ok)}
.pill.lote{background:var(--sky-soft);color:var(--blue)}
.pill.imp{background:var(--blue);color:#fff}
.pill.exc{background:var(--line);color:var(--muted)}
.pill.nc{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}

.dock{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:72px;border:1.5px solid var(--sky);border-radius:14px;background:var(--bg);color:var(--blue);font-size:15px;font-weight:500}
.tile svg{width:28px;height:28px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile:active{background:var(--sky-soft)}

/* quantidade */
.qty{display:none;flex:1;flex-direction:column;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));min-height:0}
.qty.on{display:flex}
.prod{display:flex;flex-direction:column;gap:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.etq{background:var(--blue);color:#fff;font-weight:700;font-size:11px;padding:3px 8px;border-radius:4px;letter-spacing:.04em}
.prod h2{margin:0;font-size:24px;line-height:1.1;font-weight:700}
.qty.nc .prod h2{color:var(--warn)}
.prod .code{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prev{font-size:13px;color:var(--ink);background:var(--sky-soft);border-radius:8px;padding:6px 10px}
.ncmsg{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:7px 10px;font-weight:600}
.qline{display:grid;grid-template-columns:58px 1fr 58px;gap:8px}
.qline button{border:1.5px solid var(--sky);border-radius:12px;background:var(--bg);color:var(--blue);font-size:30px;font-weight:600}
.qbox{border:2px solid var(--blue);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 8px;min-width:0}
.qbox small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qbox output{font-size:38px;font-weight:700;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums;max-width:100%;overflow:hidden;white-space:nowrap}
.qline.cod{grid-template-columns:1fr}
.qline.cod output{font-size:32px;letter-spacing:.04em}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:6px;flex:1;min-height:140px}
.keys button{border:1.5px solid var(--line);border-radius:12px;background:var(--soft);font-size:24px;font-weight:500;color:var(--ink)}
.keys button:active,.qline button:active{background:var(--sky-soft)}
.keys button:disabled{opacity:.3}
.go{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.go button{height:56px;border-radius:14px;font-size:18px;font-weight:700}
.no{border:1.5px solid var(--sky);background:var(--bg);color:var(--blue)}
.yes{border:0;background:var(--blue);color:#fff}
.yes:active{background:var(--blue-press)}
.yes:disabled{opacity:.5}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* minhas leituras */
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.back{border:0;background:none;font-size:17px;font-weight:600;color:var(--blue);padding:6px 4px}
.bar h3{margin:0;flex:1;text-align:center;font-size:18px;color:#555;padding-right:56px}
.seg{display:flex;gap:4px;padding:10px 16px 4px}
.seg button{flex:1;border:1.5px solid var(--sky);background:var(--bg);color:var(--blue);border-radius:10px;padding:8px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.it .x{grid-column:2;grid-row:1/3;border:0;background:none;color:var(--muted);font-size:24px;padding:0 4px}
.it.ask{background:var(--err-soft);margin:0 -16px;padding:10px 16px}
.askrow{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px;font-weight:600}
.askrow button{border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.askrow .del{background:var(--err);color:#fff}
.askrow .keep{background:var(--bg);border:1px solid var(--line)}
.hfoot{display:flex;flex-direction:column;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.hinfo{font-size:13px;color:var(--muted)}
.herr{font-size:13px;color:var(--err);font-weight:600}
.hfoot .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hfoot .tile{height:54px;flex-direction:row;gap:8px;font-weight:600;font-size:14px}

/* ativação */
.atv{flex:1;display:flex;flex-direction:column;gap:14px;padding:28px 20px calc(20px + env(safe-area-inset-bottom));overflow:auto}
.atv .logo{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:700;font-size:20px}
.atv .logo svg{width:34px;height:34px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round}
.atv h2{margin:6px 0 0;font-size:26px;color:#444}
.atv p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.atv label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.atv input{height:60px;border-radius:12px;border:2px solid var(--sky);background:var(--soft);padding:0 14px;font-size:28px;font-weight:700;letter-spacing:.3em;text-align:center;color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
.atv input:focus{outline:none;border-color:var(--blue)}
.amsg{font-size:14px;font-weight:600;min-height:20px}
.amsg.err{color:var(--err)} .amsg.ok{color:var(--ok)}
.atv .yes{height:58px;border-radius:14px;font-size:18px;font-weight:700}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-8px);opacity:0;background:var(--blue);color:#fff;font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;transition:.2s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- ============ ATIVAÇÃO ============ -->
<section class="scr" id="s-atv">
  <div class="atv">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>Contagem</div>
    <h2>Ativar este celular</h2>
    <p>Peça o código de 6 números no Painel do PC, na aba <b>Aparelhos</b>. Ele vale por 10 minutos.</p>
    <p id="aMotivo" hidden></p>
    <label for="aCod">Código de ativação</label>
    <input id="aCod" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code">
    <div class="amsg" id="aMsg"></div>
    <button class="yes" id="aGo">Ativar</button>
  </div>
</section>

<!-- ============ LEITOR ============ -->
<section class="scr" id="s-scan">
  <div class="head">
    <div class="t"><h1>Contagem</h1><small id="apNome"></small></div>
    <button class="chip ok" id="sync"><i></i><span>Tudo enviado</span></button>
  </div>
  <div class="cam" id="cam">
    <video id="v" playsinline muted autoplay></video>
    <div class="guide" id="guide"></div>
    <div class="cap" id="status">Iniciando…</div>
    <button class="cbtn" id="bTorch" aria-label="Lanterna"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6l-1 6h-4z"/><path d="M10 8h4v13h-4z"/></svg></button>
    <button class="cbtn" id="bZoom" aria-label="Zoom">1x</button>
    <div class="start" id="start"><div id="startMsg">Toque para ativar a câmera</div><button id="bStart">Ativar câmera</button></div>
  </div>

  <div class="sess" id="sess">
    <div class="sess-h"><b>Nesta sessão</b><span id="sessN">0 leituras</span></div>
    <div class="list" id="sessList"></div>
    <div class="dock">
      <button class="tile" id="bManual"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>Digitar código</button>
      <button class="tile" id="bHist"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Minhas leituras</button>
    </div>
  </div>

  <div class="qty" id="qty">
    <div class="prod">
      <div class="tags" id="pTags"></div>
      <h2 id="pDesc">—</h2>
      <div class="code" id="pCode"></div>
    </div>
    <div id="pNote"></div>
    <div class="qline">
      <button id="qMinus" aria-label="Diminuir">−</button>
      <div class="qbox"><small id="qLbl">Quantidade</small><output id="qVal">1</output></div>
      <button id="qPlus" aria-label="Aumentar">+</button>
    </div>
    <div class="keys" id="keys"></div>
    <div class="go"><button class="no" id="bCancel">Cancelar</button><button class="yes" id="bOk">OK</button></div>
  </div>
</section>

<!-- ============ MINHAS LEITURAS ============ -->
<section class="scr" id="s-hist">
  <div class="bar"><button class="back" id="hBack">‹ Leitor</button><h3>Minhas leituras</h3></div>
  <div class="seg"><button id="fHoje" aria-pressed="true">Hoje</button><button id="fTudo" aria-pressed="false">Últimos 30 dias</button></div>
  <div class="list" id="histList"></div>
  <div class="hfoot">
    <div class="herr" id="hErr" hidden></div>
    <div class="hinfo" id="hBase"></div>
    <div class="row">
      <button class="tile" id="bBase"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>Atualizar base</button>
      <button class="tile" id="bSync"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>Enviar agora</button>
    </div>
  </div>
</section>

<script type="module">
// Etiqueta de balança: 2 + PLU(5) + 0 + VALOR(5) + DV   ex.: 2 05280 0 01028 2
// chaveTam = quantos dígitos do início formam o código do sistema (205280 → 0000000205280)
const CFG_BALANCA = { prefixo: "2", chaveTam: 6, valorInicio: 7, valorTam: 5, tipo: "preco" };

// ==PURE==
// Separador decimal do próprio iPhone ("," em português, "." em inglês)
const DEC = (1.5).toLocaleString().replace(/[0-9]/g, "").charAt(0) || ",";
function fmt(n, d) { return Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: false }); }
function pad13(c) { return String(c).padStart(13, "0"); }
function eanValido(c) {
  if (!/^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(c)) return false;
  const d = c.split("").map(Number); const chk = d.pop(); let s = 0;
  d.reverse().forEach((n, i) => { s += n * (i % 2 === 0 ? 3 : 1); });
  return (10 - (s % 10)) % 10 === chk;
}
function lerBalanca(code, cfg, itens) {
  if (code.length !== 13 || !code.startsWith(cfg.prefixo)) return null;
  const chave = pad13(code.substr(0, cfg.chaveTam));
  const item = itens[chave];
  if (!item || !item.precoKg) return { codigo: chave, etiqueta: code, desc: "BALANÇA: " + code.substr(0, cfg.chaveTam) + " NÃO CADASTRADO", qtd: 1, un: "kg", erro: true };
  const v = parseInt(code.substr(cfg.valorInicio, cfg.valorTam), 10);
  const porUnidade = item.un === "UN";
  let qtd, info;
  if (cfg.tipo === "preco") {
    const total = v / 100, conta = total / item.precoKg;
    qtd = porUnidade ? Math.max(1, Math.round(conta)) : Math.round(conta * 1000) / 1000;
    info = "R$ " + fmt(total, 2) + " ÷ R$ " + fmt(item.precoKg, 2) + (porUnidade ? "/un" : "/kg");
  } else { qtd = porUnidade ? v : v / 1000; info = "valor da etiqueta"; }
  return { codigo: chave, etiqueta: code, desc: item.desc, qtd, un: porUnidade ? "un" : "kg", info, balanca: true };
}
// Produto achado pelo código (sem etiqueta): balança KG pede o peso; balança UN e demais pedem quantidade
function itemDireto(c13, p) {
  if (p.precoKg && p.un !== "UN") return { codigo: c13, desc: p.desc, qtd: 0, un: "kg", info: "digite o peso", pesoManual: true, balanca: true };
  if (p.precoKg) return { codigo: c13, desc: p.desc, qtd: 1, un: "un", info: "por unidade", balanca: true };
  return { codigo: c13, desc: p.desc, qtd: 1, un: "un" };
}
// manual = código digitado no teclado do app
function buscar(code, produtos, cfg, manual) {
  const dig = String(code).replace(/\D/g, "");
  // Digitado com até 4 dígitos: primeiro o padrão de balança 2 + código(4) + 0 (584 → 205840), depois completa com zeros (383)
  if (manual && dig.length >= 1 && dig.length <= 4) {
    const bal = pad13(cfg.prefixo + dig.padStart(4, "0") + "0");
    if (produtos[bal]) return itemDireto(bal, produtos[bal]);
    const u = pad13(dig);
    if (produtos[u]) return itemDireto(u, produtos[u]);
    return { codigo: u, desc: "PRODUTO NÃO CADASTRADO", qtd: 1, un: "un", erro: true, tentados: [bal, u] };
  }
  // Mais de 4 dígitos (ou câmera): completa com zeros até 13
  const c13 = pad13(dig);
  if (produtos[c13]) return itemDireto(c13, produtos[c13]);
  // Etiqueta impressa pela balança (13 dígitos começando com 2, traz o valor)
  const b = lerBalanca(c13, cfg, produtos);
  if (b) return b;
  return { codigo: c13, desc: "PRODUTO NÃO CADASTRADO", qtd: 1, un: "un", erro: true };
}
// ==/PURE==

// ================= ARMAZENAMENTO =================
const $ = id => document.getElementById(id);
const K_REG = "contagem_teste", K_AP = "contagem_aparelho", K_BASE = "contagem_base";
const ler = (k, padrao) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch { return padrao; } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

let registros = ler(K_REG, []);
// Leituras da fase de teste (sem status) não são enviadas
registros.forEach(r => { if (!r.st) r.st = "teste"; if (!r.id) r.id = "t" + Math.random().toString(36).slice(2); });
// Mantém só os últimos 30 dias de leituras já enviadas
const LIMITE = Date.now() - 30 * 86400000;
registros = registros.filter(r => r.st === "fila" || new Date(r.data).getTime() > LIMITE);
function salvar() { gravar(K_REG, registros); }
salvar();

let aparelho = ler(K_AP, null);
let base = ler(K_BASE, { versao: "", itens: [], em: "" });
let PRODUTOS = {};
function montarMapa() { PRODUTOS = {}; for (const [c, d, p, u] of base.itens) PRODUTOS[c] = { desc: d, precoKg: Number(p) || 0, un: String(u || "").toUpperCase() }; }
montarMapa();

// ================= SERVIDOR =================
const API = window.CONTAGEM_API || "";
async function api(acao, dados = {}, ms = 25000) {
  if (!/^https:\/\//.test(API)) throw new Error("O endereço do servidor não foi configurado (config.js).");
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ acao, ...dados }), signal: ctl.signal, redirect: "follow" });
    return await r.json();
  } catch (e) {
    throw new Error(e && e.name === "AbortError" ? "O servidor demorou para responder." : "Sem conexão com o servidor.");
  } finally { clearTimeout(t); }
}
function erroAparelho(j) {
  if (j && j.codigoErro === "aparelho") { pedirAtivacao(j.erro); return true; }
  return false;
}

// ================= UTILIDADES =================
let sessao = [];
let detector = null, stream = null, track = null;
let scanning = false, loopRunning = false, busy = false;
let last = "", lastCount = 0, lastTime = 0, ignorar = { code: "", until: 0 };
let atual = null, modo = "qtd", valor = "1", fresh = true, telaAtual = "";

const hoje = d => new Date(d).toDateString() === new Date().toDateString();
const hhmm = d => new Date(d).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const ddhh = d => new Date(d).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const qHtml = r => r.un === "kg" ? fmt(r.qtd, 3) + "<small> kg</small>" : fmt(r.qtd, Number.isInteger(r.qtd) ? 0 : 3);
const qTxt = r => r.un === "kg" ? fmt(r.qtd, 3) + " kg" : fmt(r.qtd, Number.isInteger(r.qtd) ? 0 : 3) + " un";

let actx = null;
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch {} }
document.addEventListener("touchstart", unlockAudio, { passive: true });
document.addEventListener("click", unlockAudio);
function beep(freq = 1800, dur = 0.09) {
  try { if (!actx) return; const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = freq; g.gain.value = 0.08; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur); } catch {}
}
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("on"), 1400); }

function tela(id) {
  telaAtual = id;
  ["s-atv", "s-scan", "s-hist"].forEach(s => $(s).classList.toggle("on", s === id));
}

// ================= ATIVAÇÃO =================
function pedirAtivacao(motivo) {
  scanning = false;
  if (motivo) { $("aMotivo").hidden = false; $("aMotivo").textContent = motivo; $("aMotivo").style.color = "var(--err)"; }
  $("aMsg").textContent = ""; $("aCod").value = "";
  tela("s-atv");
}
$("aGo").onclick = async () => {
  const cod = $("aCod").value.replace(/\D/g, "");
  const msg = $("aMsg");
  if (cod.length !== 6) { msg.className = "amsg err"; msg.textContent = "Digite os 6 números do código."; return; }
  $("aGo").disabled = true; msg.className = "amsg"; msg.textContent = "Ativando…";
  try {
    const j = await api("ativar", { codigo: cod });
    if (!j.ok) { msg.className = "amsg err"; msg.textContent = j.erro; return; }
    aparelho = { token: j.token, nome: j.nome }; gravar(K_AP, aparelho);
    msg.className = "amsg ok"; msg.textContent = "Ativado como " + j.nome + ". Baixando produtos…";
    await atualizarBase(true);
    $("aMotivo").hidden = true;
    entrar();
    toast("Celular ativado ✓");
  } catch (e) { msg.className = "amsg err"; msg.textContent = e.message; }
  finally { $("aGo").disabled = false; }
};

function entrar() {
  $("apNome").textContent = aparelho.nome;
  tela("s-scan");
  renderSess(); renderSync();
  if (!stream || !track || track.readyState === "ended") iniciarCamera(); else retomar();
  sincronizar();
}

// ================= BASE DE PRODUTOS =================
async function atualizarBase(forcar) {
  if (!aparelho) return false;
  try {
    const j = await api("base", { token: aparelho.token, versao: forcar ? "" : base.versao }, 90000);
    if (!j.ok) { erroAparelho(j); return false; }
    if (!j.igual) { base = { versao: j.versao, itens: j.produtos, em: new Date().toISOString() }; montarMapa(); }
    else base.em = new Date().toISOString();
    if (!gravar(K_BASE, base)) toast("Sem espaço para guardar a base");
    renderBase();
    return true;
  } catch { return false; }
}
function renderBase() {
  $("hBase").textContent = base.itens.length
    ? "Base: " + base.itens.length.toLocaleString("pt-BR") + " produtos · conferida em " + ddhh(base.em)
    : "Base de produtos ainda não baixada.";
}

// ================= ENVIO (fila) =================
let enviando = false, ultimoErro = "", falhas = 0, proxTentativa = 0;
async function sincronizar(forcar) {
  if (!aparelho || enviando) return;
  if (forcar) proxTentativa = 0;
  const fila = registros.filter(r => r.st === "fila");
  if (!fila.length) { ultimoErro = ""; renderSync(); return; }
  if (Date.now() < proxTentativa) return;
  enviando = true; renderSync();
  try {
    const pacote = fila.slice(0, 200).map(r => ({ id: r.id, codigo: r.codigo, etiqueta: r.etiqueta || "", desc: r.desc, qtd: r.qtd, un: r.un, data: r.data, nc: !!r.naoCadastrado }));
    const j = await api("enviar", { token: aparelho.token, leituras: pacote });
    if (!j.ok) { if (erroAparelho(j)) throw new Error(j.erro); throw new Error(j.erro || "Erro no servidor"); }
    const ok = new Set(j.recebidos);
    registros.forEach(r => { if (ok.has(r.id)) { r.st = "enviado"; if (!r.srv) r.srv = "Pendente"; } });
    salvar(); ultimoErro = ""; falhas = 0;
  } catch (e) {
    ultimoErro = e.message; falhas++;
    proxTentativa = Date.now() + Math.min(60000, 3000 * 2 ** Math.min(falhas, 5));
  }
  enviando = false;
  renderSync(); renderSess(); if (telaAtual === "s-hist") renderHist();
  if (!ultimoErro && registros.some(r => r.st === "fila")) setTimeout(sincronizar, 400);
}
setInterval(sincronizar, 4000);
window.addEventListener("online", () => sincronizar(true));

function renderSync() {
  const n = registros.filter(r => r.st === "fila").length, c = $("sync");
  c.hidden = !aparelho;
  const semRede = !navigator.onLine || !!ultimoErro;
  c.className = "chip " + (!n ? "ok" : semRede ? "err" : "warn");
  c.querySelector("span").textContent = !n ? "Tudo enviado" : semRede ? "Sem conexão · " + n + " na fila" : n + " enviando…";
  const he = $("hErr");
  he.hidden = !ultimoErro || !n; he.textContent = ultimoErro ? "Último envio falhou: " + ultimoErro + " As leituras continuam guardadas." : "";
}
$("sync").onclick = () => { sincronizar(true); toast(registros.some(r => r.st === "fila") ? "Tentando enviar…" : "Tudo enviado ✓"); };

// ================= CÂMERA / LEITOR =================
const video = $("v"), guide = $("guide"), statusEl = $("status");
async function criarDetector() {
  const formats = ["ean_13", "ean_8", "upc_a"];
  if ("BarcodeDetector" in window) {
    try { const sup = await window.BarcodeDetector.getSupportedFormats(); if (sup.includes("ean_13")) return new window.BarcodeDetector({ formats }); } catch {}
  }
  const urls = [
    "https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js",
    "https://fastly.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js",
    "https://unpkg.com/barcode-detector@2/dist/es/pure.min.js",
  ];
  for (const u of urls) { try { const m = await import(u); return new m.BarcodeDetector({ formats }); } catch {} }
  throw new Error("leitor indisponível");
}
async function iniciarCamera() {
  if (!navigator.mediaDevices?.getUserMedia) { mostrarStart("Câmera indisponível. Abra este endereço (https) no Safari."); return; }
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    video.srcObject = stream; await video.play();
    track = stream.getVideoTracks()[0];
    extrasCamera(); $("start").style.display = "none"; pedirWakeLock();
    if (telaAtual === "s-scan" && !$("qty").classList.contains("on")) retomar();
  } catch (e) {
    mostrarStart(e && e.name === "NotAllowedError" ? "Permita o acesso à câmera para ler os códigos." : "Toque para ativar a câmera");
  }
}
function mostrarStart(msg) { $("startMsg").textContent = msg; $("start").style.display = "flex"; }
let zoomCaps = null, zoomAlto = false, torchOn = false;
function extrasCamera() {
  let caps = {}; try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch {}
  try { if (caps.focusMode && caps.focusMode.includes("continuous")) track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); } catch {}
  $("bTorch").style.display = caps.torch ? "flex" : "none";
  if (caps.zoom && caps.zoom.max >= 1.5) { zoomCaps = caps.zoom; $("bZoom").style.display = "flex"; }
}
$("bTorch").onclick = async () => { torchOn = !torchOn; try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch { torchOn = false; } };
$("bZoom").onclick = async () => {
  zoomAlto = !zoomAlto; const z = zoomAlto ? Math.min(2, zoomCaps.max) : Math.max(1, zoomCaps.min);
  try { await track.applyConstraints({ advanced: [{ zoom: z }] }); $("bZoom").textContent = (zoomAlto ? 2 : 1) + "x"; } catch {}
};
$("bStart").onclick = () => { unlockAudio(); iniciarCamera(); };
let wakeLock = null;
async function pedirWakeLock() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !aparelho) return;
  if (!track || track.readyState === "ended") iniciarCamera(); else { video.play().catch(() => {}); pedirWakeLock(); }
  sincronizar(true);
  if (!base.em || Date.now() - new Date(base.em).getTime() > 30 * 60000) atualizarBase(false);
});

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
function retomar() {
  scanning = true;
  statusEl.textContent = !detector ? "Carregando leitor…" : !base.itens.length ? "Base de produtos não baixada" : "Aponte para o código de barras";
  if (!loopRunning) { loopRunning = true; requestAnimationFrame(loop); }
}
async function loop() {
  if (!scanning) { loopRunning = false; return; }
  if (detector && !busy && video.readyState >= 2 && video.videoWidth) {
    busy = true;
    try {
      const vw = video.videoWidth, vh = video.videoHeight;
      const b = video.getBoundingClientRect(), g = guide.getBoundingClientRect();
      const scale = Math.max(b.width / vw, b.height / vh);
      const offX = (vw - b.width / scale) / 2, offY = (vh - b.height / scale) / 2;
      let sx = offX + (g.left - b.left) / scale, sy = offY + (g.top - b.top) / scale;
      let sw = g.width / scale, sh = g.height / scale;
      sx = Math.max(0, sx - sw * 0.05); sw = Math.min(vw - sx, sw * 1.1);
      sy = Math.max(0, sy - sh * 0.1); sh = Math.min(vh - sy, sh * 1.2);
      canvas.width = Math.round(sw); canvas.height = Math.round(sh);
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      const res = await detector.detect(canvas);
      for (const r of res) { if (tratar(r.rawValue)) break; }
    } catch {}
    busy = false;
  }
  requestAnimationFrame(loop);
}
function tratar(raw) {
  if (!scanning) return false;
  const code = String(raw || "").trim();
  if (!eanValido(code)) return false;
  const now = performance.now();
  if (code === ignorar.code && now < ignorar.until) return false;
  lastCount = (code === last && now - lastTime < 1500) ? lastCount + 1 : 1;
  last = code; lastTime = now;
  if (lastCount < 2) return false;
  last = ""; lastCount = 0; scanning = false;
  guide.classList.add("hit"); setTimeout(() => guide.classList.remove("hit"), 350);
  abrir(code);
  return true;
}

// ================= TELA DE QUANTIDADE =================
function abrir(code, manual) {
  atual = buscar(code, PRODUTOS, CFG_BALANCA, !!manual);
  if (atual.erro) beep(300, 0.25); else beep();
  modo = "qtd";
  if (atual.pesoManual) { valor = ""; fresh = false; }
  else { valor = atual.un === "kg" ? fmt(atual.qtd, 3) : String(atual.qtd); fresh = true; }
  mostrarCard();
}
function mostrarCard() {
  scanning = false;
  $("sess").hidden = true; $("qty").classList.add("on"); $("cam").classList.add("small");
  statusEl.textContent = "Leitura pausada";
  renderCard();
}
function fechar() {
  $("qty").classList.remove("on"); $("sess").hidden = false; $("cam").classList.remove("small");
  atual = null; renderSess(); retomar();
}
function renderCard() {
  $("qty").classList.toggle("nc", modo === "qtd" && !!atual?.erro);
  if (modo === "codigo") {
    $("pTags").innerHTML = ""; $("pDesc").textContent = "Digite o código de barras";
    $("pCode").textContent = "Para etiqueta danificada"; $("pNote").innerHTML = ""; $("qLbl").textContent = "Código";
  } else {
    $("pTags").innerHTML = atual.balanca && !atual.erro ? '<span class="etq">BALANÇA</span><span>' + esc(atual.info) + "</span>" : "";
    $("pDesc").textContent = atual.desc;
    $("pCode").textContent = atual.etiqueta ? "Cód. " + atual.codigo + " · etiqueta " + atual.etiqueta : (atual.balanca ? "Cód. " : "EAN ") + atual.codigo;
    const prev = registros.filter(r => r.codigo === atual.codigo && hoje(r.data) && r.st !== "teste" && r.srv !== "Excluída");
    $("pNote").innerHTML = atual.erro ? '<div class="ncmsg">' + (atual.tentados ? "Procurei " + atual.tentados.join(" e ") + " e não achei. " : "Código fora da base. ") + 'A leitura é guardada, mas só entra no TXT depois de corrigida no painel.</div>'
      : prev.length ? '<div class="prev">Já lançado hoje: <b>' + prev.slice(0, 3).map(r => qTxt(r) + " às " + hhmm(r.data)).join(", ") + (prev.length > 3 ? "…" : "") + "</b></div>" : "";
    $("qLbl").textContent = atual.un === "kg" ? "Peso (kg)" : "Quantidade";
  }
  $("qVal").textContent = valor || "0";
  $("kComma").disabled = modo === "codigo";
  $("qMinus").hidden = $("qPlus").hidden = modo === "codigo";
  document.querySelector(".qline").classList.toggle("cod", modo === "codigo");
}
const teclas = ["1","2","3","4","5","6","7","8","9",DEC,"0","⌫"];
$("keys").innerHTML = teclas.map(k => `<button data-k="${k}"${k === DEC ? ' id="kComma"' : ""} aria-label="${k === "⌫" ? "Apagar" : k}">${k}</button>`).join("");
$("keys").addEventListener("click", e => { const k = e.target.closest("button")?.dataset.k; if (k) tecla(k); });
function tecla(k) {
  if (k === "⌫") { valor = fresh ? "" : valor.slice(0, -1); }
  else if (k === DEC) { if (modo === "codigo") return; if (fresh) valor = "0" + DEC; else if (!valor.includes(DEC)) valor = (valor || "0") + DEC; }
  else { if (fresh) valor = ""; if (valor.length < 14) valor = (modo !== "codigo" && valor === "0" ? "" : valor) + k; }
  fresh = false; renderCard();
}
const numVal = () => parseFloat(String(valor).replace(DEC, ".")) || 0;
function passo(d) {
  const kg = atual.un === "kg"; let n = numVal() + d * (kg ? 0.1 : 1); if (n < 0) n = 0;
  valor = kg ? fmt(n, 3) : String(Math.round(n)); fresh = false; renderCard();
}
$("qMinus").onclick = () => passo(-1);
$("qPlus").onclick = () => passo(1);
function tremer() { const q = $("qty"); q.classList.remove("shake"); void q.offsetWidth; q.classList.add("shake"); }

$("bOk").onclick = () => {
  if (modo === "codigo") {
    if (valor.length < 1 || valor.length > 14) { tremer(); beep(300, 0.25); toast("Digite o código"); return; }
    abrir(valor, true); return;
  }
  const q = numVal();
  if (!(q > 0)) { tremer(); return; }
  const r = { id: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8), codigo: atual.codigo, etiqueta: atual.etiqueta || "",
    desc: atual.desc, qtd: Math.round(q * 1000) / 1000, un: atual.un, data: new Date().toISOString(), naoCadastrado: !!atual.erro, st: "fila" };
  registros.unshift(r); sessao.unshift(r.id);
  if (!gravar(K_REG, registros)) toast("Atenção: memória do celular cheia");
  ignorar = { code: atual.etiqueta || atual.codigo, until: performance.now() + 1500 };
  toast("Salvo ✓"); fechar(); renderSync();
  sincronizar(true);
};
$("bCancel").onclick = () => fechar();
$("bManual").onclick = () => { modo = "codigo"; valor = ""; fresh = false; atual = null; mostrarCard(); };

// ================= SESSÃO =================
function pillHtml(r) {
  if (r.st === "teste") return '<span class="pill exc">Teste · não enviado</span>';
  if (r.st === "fila") return '<span class="pill fila">Na fila</span>';
  if (r.srv === "Lote") return '<span class="pill lote">Lote ' + esc(r.lote) + "</span>";
  if (r.srv === "Importado") return '<span class="pill imp">Importado</span>';
  if (r.srv === "Excluída") return '<span class="pill exc">Excluída</span>';
  return '<span class="pill env">Enviado</span>';
}
function itemHtml(r) {
  return `<div class="it${r.naoCadastrado ? " nc" : ""}${r.srv === "Excluída" ? " exc" : ""}"><div class="d">${esc(r.desc)}</div><div class="q num">${qHtml(r)}</div>
    <div class="s"><span class="num">${r.codigo}</span><span>${hhmm(r.data)}</span>${pillHtml(r)}${r.naoCadastrado ? '<span class="pill nc">Não cadastrado</span>' : ""}</div></div>`;
}
function renderSess() {
  const L = sessao.map(id => registros.find(r => r.id === id)).filter(Boolean);
  $("sessN").textContent = L.length + (L.length === 1 ? " leitura" : " leituras");
  $("sessList").innerHTML = L.length ? L.map(itemHtml).join("") : '<div class="empty">Nenhuma leitura nesta sessão.<br>Aponte a câmera para um código de barras.</div>';
}

// ================= MINHAS LEITURAS =================
let filtro = "hoje", pergunta = null;
$("bHist").onclick = () => { scanning = false; pergunta = null; tela("s-hist"); renderHist(); renderBase(); renderSync(); atualizarStatus(); };
$("hBack").onclick = () => { tela("s-scan"); renderSess(); retomar(); };
$("fHoje").onclick = () => { filtro = "hoje"; renderHist(); };
$("fTudo").onclick = () => { filtro = "tudo"; renderHist(); };
$("bBase").onclick = async () => { toast("Atualizando base…"); const ok = await atualizarBase(true); toast(ok ? "Base atualizada ✓" : "Não foi possível atualizar"); };
$("bSync").onclick = () => { sincronizar(true); toast(registros.some(r => r.st === "fila") ? "Enviando…" : "Tudo enviado ✓"); };

async function atualizarStatus() {
  if (!aparelho) return;
  const ids = registros.filter(r => r.st === "enviado" && r.srv !== "Importado" && r.srv !== "Excluída").map(r => r.id).slice(0, 800);
  if (!ids.length) return;
  try {
    const j = await api("status", { token: aparelho.token, ids });
    if (!j.ok) { erroAparelho(j); return; }
    registros.forEach(r => { const s = j.status[r.id]; if (s) { r.srv = s.status; r.lote = s.lote; if (s.codigo) { r.codigo = s.codigo; r.desc = s.desc; r.naoCadastrado = s.nc; } } });
    salvar(); if (telaAtual === "s-hist") renderHist();
  } catch {}
}
function podeExcluir(r) { return r.st === "fila" || r.st === "teste" || (r.st === "enviado" && (!r.srv || r.srv === "Pendente")); }
function renderHist() {
  $("fHoje").setAttribute("aria-pressed", filtro === "hoje"); $("fTudo").setAttribute("aria-pressed", filtro === "tudo");
  const L = filtro === "hoje" ? registros.filter(r => hoje(r.data)) : registros;
  $("histList").innerHTML = L.length ? L.map(r => {
    const ask = pergunta === r.id, pode = podeExcluir(r);
    const dt = hoje(r.data) ? hhmm(r.data) : ddhh(r.data);
    return `<div class="it${r.naoCadastrado ? " nc" : ""}${r.srv === "Excluída" ? " exc" : ""}${ask ? " ask" : ""}"><div class="d">${esc(r.desc)}</div>
      ${pode && !ask ? `<button class="x" data-del="${r.id}" aria-label="Excluir">×</button>` : `<div class="q num">${qHtml(r)}</div>`}
      <div class="s"><span class="num">${r.codigo}</span><span>${dt}</span>${pillHtml(r)}${pode && !ask ? `<b class="num" style="margin-left:auto;color:var(--blue)">${qTxt(r)}</b>` : ""}</div>
      ${ask ? `<div class="askrow">Excluir esta leitura? <button class="del" data-yes="${r.id}">Excluir</button><button class="keep" data-keep="1">Manter</button></div>` : ""}</div>`;
  }).join("") : '<div class="empty">Nenhuma leitura ' + (filtro === "hoje" ? "hoje." : "nos últimos 30 dias.") + "</div>";
}
$("histList").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.del) { pergunta = b.dataset.del; renderHist(); return; }
  if (b.dataset.keep) { pergunta = null; renderHist(); return; }
  if (b.dataset.yes) {
    const r = registros.find(x => x.id === b.dataset.yes); pergunta = null;
    if (!r) { renderHist(); return; }
    if (r.st === "enviado") {
      b.disabled = true;
      try {
        const j = await api("excluir", { token: aparelho.token, id: r.id });
        if (!j.ok) { erroAparelho(j); toast(j.erro || "Não foi possível excluir"); await atualizarStatus(); renderHist(); return; }
      } catch (err) { toast("Sem conexão: tente de novo"); renderHist(); return; }
    }
    registros = registros.filter(x => x.id !== r.id); sessao = sessao.filter(x => x !== r.id);
    salvar(); toast("Leitura excluída"); renderHist(); renderSess(); renderSync();
  }
});

// ================= INÍCIO =================
statusEl.textContent = "Carregando leitor…";
criarDetector()
  .then(d => { detector = d; if (scanning) retomar(); })
  .catch(() => { statusEl.textContent = "Erro ao carregar o leitor. Verifique a internet e recarregue."; });

if (!aparelho) pedirAtivacao();
else { entrar(); atualizarBase(false); }
</script>
