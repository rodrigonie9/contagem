<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contagem">
<meta name="theme-color" content="#0f1115">
<title>Contagem MM</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--txt:#f2f4f8;--mut:#9aa3b2;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--acc:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top);user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{display:flex;align-items:center;gap:8px;padding:8px 12px}
header h1{font-size:17px;margin:0;flex:1}
#count{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
#cam{position:relative;flex:0 0 34dvh;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
#guide{position:absolute;left:7%;right:7%;top:22%;height:56%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35);transition:border-color .12s,background .12s}
#guide::after{content:"";position:absolute;left:5%;right:5%;top:50%;height:2px;background:var(--err);opacity:.8}
#guide.hit{border-color:var(--ok);background:rgba(34,197,94,.25)}
#status{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
#camBtns{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:8px}
#camBtns button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;font-weight:700;display:none}
#start{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#000;padding:20px;text-align:center;font-size:15px}
#start button{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:700}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#idle{flex:1;display:flex;flex-direction:column;min-height:0}
#idle.hide{display:none}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;padding:10px 12px 4px}
.tools button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:15px;font-weight:600}
#lista{flex:1;overflow:auto;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row .d{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t.nc{color:var(--warn)}
.row .s{font-size:12px;color:var(--mut);margin-top:2px}
.row .n{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row button{background:none;border:0;color:var(--mut);font-size:22px;padding:4px 6px}
.vazio{color:var(--mut);text-align:center;padding:24px 8px;font-size:15px}
#card{display:none;flex:1;flex-direction:column;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));min-height:0}
#card.show{display:flex}
#cDesc{font-size:20px;font-weight:700;line-height:1.2}
#card.erro #cDesc{color:var(--warn)}
#cInfo{font-size:13px;color:var(--mut);margin-top:-4px}
.qbox{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:2px solid var(--acc);border-radius:12px;padding:6px 14px}
.qbox .lbl{color:var(--mut);font-size:13px}
.qbox .q{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:6px;flex:1;min-height:0}
.keys button{font-size:24px;border:0;border-radius:10px;background:#252a35;color:var(--txt);min-height:40px}
.keys button:active{background:#3a4152}
.keys button:disabled{opacity:.3}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.acts button{height:56px;border:0;border-radius:12px;font-size:19px;font-weight:700}
#bCancel{background:#2a2f3a;color:var(--txt)}
#bOk{background:var(--ok);color:#06210f}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);background:var(--ok);color:#06210f;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Contagem · teste</h1>
  <span id="count">0 itens</span>
</header>

<div id="cam">
  <video id="v" playsinline muted autoplay></video>
  <div id="guide"></div>
  <div id="status">Iniciando…</div>
  <div id="camBtns">
    <button id="bTorch" aria-label="Lanterna">🔦</button>
    <button id="bZoom" aria-label="Zoom">1x</button>
  </div>
  <div id="start">
    <div id="startMsg">Toque para ativar a câmera</div>
    <button id="bStart">Ativar câmera</button>
  </div>
</div>

<main>
  <section id="idle">
    <div class="tools">
      <button id="bManual">⌨ Digitar código</button>
      <button id="bExport">Exportar</button>
      <button id="bClear">Zerar</button>
    </div>
    <div id="lista"></div>
  </section>

  <section id="card">
    <div id="cDesc"></div>
    <div id="cInfo"></div>
    <div class="qbox"><span class="lbl" id="qLbl">Quantidade</span><span class="q" id="qVal">1</span></div>
    <div class="keys" id="keys"></div>
    <div class="acts">
      <button id="bCancel">Cancelar</button>
      <button id="bOk">OK</button>
    </div>
  </section>
</main>
<div id="toast"></div>

<script type="module">
// ================= BASE DE TESTE =================
// Base no formato do sistema: código sempre com 13 dígitos (zeros à esquerda).
// Itens de balança: código "2" + PLU (5 dígitos), completado com zeros, e preço por kg.
const PRODUTOS = {
  "7908580201349": { desc: "BATATA KLAIN" },
  "7896436100628": { desc: "ÁGUA DA PEDRA" },
  "0000000205280": { desc: "MORANGUINHO KG", precoKg: 34.98 },
};
// Etiqueta: 2 + PLU(5) + 0 + VALOR(5) + DV   ex.: 2 05280 0 01028 2
// chaveTam = quantos dígitos do início formam o código do sistema (205280)
const CFG_BALANCA = { prefixo: "2", chaveTam: 6, valorInicio: 7, valorTam: 5, tipo: "preco" };

// ==PURE==
function fmt(n, d) { return Number(n).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }); }

function eanValido(c) {
  if (!/^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(c)) return false;
  const d = c.split("").map(Number);
  const chk = d.pop();
  let s = 0;
  d.reverse().forEach((n, i) => { s += n * (i % 2 === 0 ? 3 : 1); });
  return (10 - (s % 10)) % 10 === chk;
}

function pad13(c) { return String(c).padStart(13, "0"); }

function lerBalanca(code, cfg, itens) {
  if (code.length !== 13 || !code.startsWith(cfg.prefixo)) return null;
  const chave = pad13(code.substr(0, cfg.chaveTam));
  const item = itens[chave];
  if (!item || !item.precoKg) return { codigo: chave, etiqueta: code, desc: "BALANÇA: " + code.substr(0, cfg.chaveTam) + " NÃO CADASTRADO", qtd: 1, un: "kg", erro: true };
  const v = parseInt(code.substr(cfg.valorInicio, cfg.valorTam), 10);
  let peso, info;
  if (cfg.tipo === "preco") {
    const total = v / 100;
    peso = Math.round((total / item.precoKg) * 1000) / 1000;
    info = "Balança · R$ " + fmt(total, 2) + " ÷ R$ " + fmt(item.precoKg, 2) + "/kg";
  } else {
    peso = v / 1000;
    info = "Balança · peso da etiqueta";
  }
  return { codigo: chave, etiqueta: code, desc: item.desc, qtd: peso, un: "kg", info };
}

function buscar(code, produtos, cfg) {
  const c13 = pad13(code);
  const p = produtos[c13];
  if (p && !p.precoKg) return { codigo: c13, desc: p.desc, qtd: 1, un: "un" };
  const b = lerBalanca(c13, cfg, produtos);
  if (b) return b;
  return { codigo: c13, desc: "PRODUTO NÃO CADASTRADO", qtd: 1, un: "un", erro: true };
}
// ==/PURE==

// ================= APP =================
const $ = id => document.getElementById(id);
const video = $("v"), guide = $("guide"), statusEl = $("status");
const LS = "contagem_teste";
let registros = [];
try { registros = JSON.parse(localStorage.getItem(LS) || "[]"); } catch {}
function salvar() { try { localStorage.setItem(LS, JSON.stringify(registros)); } catch {} }

let detector = null, stream = null, track = null;
let scanning = false, loopRunning = false, busy = false;
let last = "", lastCount = 0, lastTime = 0, ignorar = { code: "", until: 0 };
let atual = null, modo = "qtd", valor = "1", fresh = true;

// ---- som ----
let actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch {}
}
document.addEventListener("touchstart", unlockAudio, { passive: true });
document.addEventListener("click", unlockAudio);
function beep(freq = 1800, dur = 0.09) {
  try {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = freq; g.gain.value = 0.08;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}

function toast(t) {
  const el = $("toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1100);
}

// ---- leitor ----
async function criarDetector() {
  const formats = ["ean_13", "ean_8", "upc_a"];
  if ("BarcodeDetector" in window) {
    try {
      const sup = await window.BarcodeDetector.getSupportedFormats();
      if (sup.includes("ean_13")) return new window.BarcodeDetector({ formats });
    } catch {}
  }
  const urls = [
    "https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js",
    "https://fastly.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js",
    "https://unpkg.com/barcode-detector@2/dist/es/pure.min.js",
  ];
  for (const u of urls) {
    try { const m = await import(u); return new m.BarcodeDetector({ formats }); } catch {}
  }
  throw new Error("leitor indisponível");
}

async function iniciarCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    mostrarStart("Câmera indisponível. Abra este endereço (https) no Safari.");
    return;
  }
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
    video.srcObject = stream;
    await video.play();
    track = stream.getVideoTracks()[0];
    extrasCamera();
    $("start").style.display = "none";
    pedirWakeLock();
    retomar();
  } catch (e) {
    mostrarStart(e && e.name === "NotAllowedError"
      ? "Permita o acesso à câmera para ler os códigos."
      : "Toque para ativar a câmera");
  }
}
function mostrarStart(msg) { $("startMsg").textContent = msg; $("start").style.display = "flex"; }

let zoomCaps = null, zoomAlto = false, torchOn = false;
function extrasCamera() {
  let caps = {};
  try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch {}
  try { if (caps.focusMode && caps.focusMode.includes("continuous")) track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); } catch {}
  $("bTorch").style.display = caps.torch ? "block" : "none";
  if (caps.zoom && caps.zoom.max >= 1.5) { zoomCaps = caps.zoom; $("bZoom").style.display = "block"; }
}
$("bTorch").onclick = async () => {
  torchOn = !torchOn;
  try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch { torchOn = false; }
};
$("bZoom").onclick = async () => {
  zoomAlto = !zoomAlto;
  const z = zoomAlto ? Math.min(2, zoomCaps.max) : Math.max(1, zoomCaps.min);
  try { await track.applyConstraints({ advanced: [{ zoom: z }] }); $("bZoom").textContent = (zoomAlto ? 2 : 1) + "x"; } catch {}
};
$("bStart").onclick = () => { unlockAudio(); iniciarCamera(); };

let wakeLock = null;
async function pedirWakeLock() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (!track || track.readyState === "ended") iniciarCamera();
  else { video.play().catch(() => {}); pedirWakeLock(); }
});

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

function retomar() {
  scanning = true;
  if (detector) statusEl.textContent = "Aponte para o código de barras";
  if (!loopRunning) { loopRunning = true; requestAnimationFrame(loop); }
}

async function loop() {
  if (!scanning) { loopRunning = false; return; }
  if (detector && !busy && video.readyState >= 2 && video.videoWidth) {
    busy = true;
    try {
      // recorta só a área do retângulo-guia (mais rápido e evita ler outro código)
      const vw = video.videoWidth, vh = video.videoHeight;
      const b = video.getBoundingClientRect(), g = guide.getBoundingClientRect();
      const scale = Math.max(b.width / vw, b.height / vh);
      const offX = (vw - b.width / scale) / 2, offY = (vh - b.height / scale) / 2;
      let sx = offX + (g.left - b.left) / scale, sy = offY + (g.top - b.top) / scale;
      let sw = g.width / scale, sh = g.height / scale;
      sx = Math.max(0, sx - sw * 0.05); sw = Math.min(vw - sx, sw * 1.1);
      sy = Math.max(0, sy - sh * 0.1); sh = Math.min(vh - sy, sh * 1.2);
      canvas.width = Math.round(sw); canvas.height = Math.round(sh);
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      const res = await detector.detect(canvas);
      for (const r of res) { if (tratar(r.rawValue)) break; }
    } catch {}
    busy = false;
  }
  requestAnimationFrame(loop);
}

function tratar(raw) {
  if (!scanning) return false;
  const code = String(raw || "").trim();
  if (!eanValido(code)) return false;
  const now = performance.now();
  if (code === ignorar.code && now < ignorar.until) return false;
  // exige 2 leituras iguais seguidas: elimina leitura errada
  lastCount = (code === last && now - lastTime < 1500) ? lastCount + 1 : 1;
  last = code; lastTime = now;
  if (lastCount < 2) return false;
  last = ""; lastCount = 0;
  scanning = false;
  guide.classList.add("hit");
  setTimeout(() => guide.classList.remove("hit"), 350);
  abrir(code);
  return true;
}

// ---- tela de quantidade ----
function abrir(code) {
  atual = buscar(code, PRODUTOS, CFG_BALANCA);
  if (atual.erro) { beep(300, 0.25); } else { beep(); }
  modo = "qtd";
  valor = atual.un === "kg" ? fmt(atual.qtd, 3) : String(atual.qtd);
  fresh = true;
  mostrarCard();
}
function mostrarCard() {
  $("idle").classList.add("hide");
  $("card").classList.add("show");
  statusEl.textContent = "Leitura pausada";
  renderCard();
}
function fechar() {
  $("card").classList.remove("show");
  $("idle").classList.remove("hide");
  atual = null;
  renderLista();
  retomar();
}
function renderCard() {
  const card = $("card");
  card.classList.toggle("erro", modo === "qtd" && !!atual?.erro);
  if (modo === "codigo") {
    $("cDesc").textContent = "Digite o código de barras";
    $("cInfo").textContent = "Para etiqueta danificada";
    $("qLbl").textContent = "Código";
  } else {
    $("cDesc").textContent = atual.desc;
    $("cInfo").textContent = (atual.info ? atual.info + " · " : "") + "Cód. " + atual.codigo;
    $("qLbl").textContent = atual.un === "kg" ? "Peso (kg)" : "Quantidade";
  }
  $("qVal").textContent = valor || "0";
  $("kComma").disabled = modo === "codigo";
}

const teclas = ["1","2","3","4","5","6","7","8","9",",","0","⌫"];
$("keys").innerHTML = teclas.map(k => `<button data-k="${k}"${k === "," ? ' id="kComma"' : ""}>${k}</button>`).join("");
$("keys").addEventListener("click", e => { const k = e.target.closest("button")?.dataset.k; if (k) tecla(k); });

function tecla(k) {
  if (k === "⌫") { valor = fresh ? "" : valor.slice(0, -1); fresh = false; }
  else if (k === ",") {
    if (modo === "codigo") return;
    if (fresh) { valor = "0,"; fresh = false; }
    else if (!valor.includes(",")) valor = (valor || "0") + ",";
  } else {
    if (fresh) { valor = ""; fresh = false; }
    if (valor.length < 14) valor = (valor === "0" ? "" : valor) + k;
  }
  renderCard();
}

function tremer() { const q = $("card"); q.classList.remove("shake"); void q.offsetWidth; q.classList.add("shake"); }

$("bOk").onclick = () => {
  if (modo === "codigo") {
    if (!eanValido(valor)) { tremer(); beep(300, 0.25); toast("Código inválido"); return; }
    abrir(valor);
    return;
  }
  const q = parseFloat(String(valor).replace(",", "."));
  if (!(q > 0)) { tremer(); return; }
  registros.unshift({
    codigo: atual.codigo, etiqueta: atual.etiqueta || "", desc: atual.desc,
    qtd: q, un: atual.un, data: new Date().toISOString(), naoCadastrado: !!atual.erro,
  });
  salvar();
  ignorar = { code: atual.codigo, until: performance.now() + 1500 };
  toast("Salvo ✓");
  fechar();
};
$("bCancel").onclick = () => fechar();
$("bManual").onclick = () => { scanning = false; modo = "codigo"; valor = ""; fresh = false; atual = null; mostrarCard(); };

// ---- lista / exportar ----
function renderLista() {
  $("count").textContent = registros.length + (registros.length === 1 ? " item" : " itens");
  const el = $("lista");
  if (!registros.length) { el.innerHTML = '<div class="vazio">Nenhuma leitura ainda.<br>Aponte a câmera para um código de barras.</div>'; return; }
  el.innerHTML = registros.map((r, i) => {
    const hora = new Date(r.data).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    const q = r.un === "kg" ? fmt(r.qtd, 3) + " kg" : fmt(r.qtd, Number.isInteger(r.qtd) ? 0 : 3);
    return `<div class="row"><div class="d"><div class="t${r.naoCadastrado ? " nc" : ""}">${esc(r.desc)}</div>
      <div class="s">${r.codigo}${r.etiqueta ? " · etiqueta " + r.etiqueta : ""} · ${hora}</div></div>
      <div class="n">${q}</div><button data-i="${i}" aria-label="Apagar">×</button></div>`;
  }).join("");
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
$("lista").addEventListener("click", e => {
  const i = e.target.closest("button")?.dataset.i;
  if (i === undefined) return;
  if (confirm("Apagar " + registros[i].desc + "?")) { registros.splice(+i, 1); salvar(); renderLista(); }
});
$("bClear").onclick = () => {
  if (registros.length && confirm("Apagar todas as " + registros.length + " leituras?")) { registros = []; salvar(); renderLista(); }
};
$("bExport").onclick = async () => {
  if (!registros.length) { toast("Nada para exportar"); return; }
  const linhas = ["codigo;descricao;quantidade;unidade;etiqueta;data_hora"];
  for (const r of [...registros].reverse()) {
    linhas.push([r.codigo, r.desc.replace(/;/g, ","), String(r.qtd).replace(".", ","), r.un, r.etiqueta || "",
      new Date(r.data).toLocaleString("pt-BR")].join(";"));
  }
  const csv = "\ufeff" + linhas.join("\r\n");
  const nome = "contagem_" + new Date().toISOString().slice(0, 10) + ".csv";
  const file = new File([csv], nome, { type: "text/csv" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: nome }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

// ---- início ----
renderLista();
statusEl.textContent = "Carregando leitor…";
criarDetector()
  .then(d => { detector = d; if (scanning) statusEl.textContent = "Aponte para o código de barras"; })
  .catch(() => { statusEl.textContent = "Erro ao carregar o leitor. Verifique a internet e recarregue."; });
iniciarCamera();
</script>
</body>
</html>
